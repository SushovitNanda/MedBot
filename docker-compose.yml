services:

  # ── Vector Database ──────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: medrag_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"   # gRPC (optional)
    volumes:
      - ./qdrant_data:/qdrant/storage   # vectors persist on User 2's SSD
    environment:
      - QDRANT__STORAGE__ON_DISK_PAYLOAD=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Backend API ───────────────────────────────────────────────────────────────
  fastapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medrag_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - QDRANT_HOST=qdrant           # Docker service name
      - QDRANT_PORT=6333
    volumes:
      - ./backend/models_cache:/app/models_cache   # persists downloaded models
      - ./backend/bm25_indexes:/app/bm25_indexes   # persists BM25 indexes
      - ./backend/extracted_images:/app/extracted_images
      # Mount the PDF data directories (read-only)
      - "C:\\Users\\SUSHOVIT\\OneDrive\\Desktop\\MedRAG\\DHA Data:/data/DHA:ro"
      - "C:\\Users\\SUSHOVIT\\OneDrive\\Desktop\\MedRAG\\MDS Data:/data/MDS:ro"
      - "C:\\Users\\SUSHOVIT\\OneDrive\\Desktop\\MedRAG\\ORE Data:/data/ORE:ro"
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── Frontend ──────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medrag_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_API_TOKEN=your-random-secret-token-here   # match API_SECRET_TOKEN
    depends_on:
      fastapi:
        condition: service_healthy

  # ── LLM Observability (optional — disable by commenting out) ─────────────────
  langfuse:
    image: ghcr.io/langfuse/langfuse:3
    container_name: medrag_langfuse
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=postgresql://langfuse:langfuse@langfuse_db:5432/langfuse
      - NEXTAUTH_SECRET=medrag-langfuse-secret
      - SALT=medrag-salt
      - NEXTAUTH_URL=http://localhost:3001
      - TELEMETRY_ENABLED=false
    depends_on:
      - langfuse_db

  langfuse_db:
    image: postgres:16
    container_name: medrag_langfuse_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=langfuse
      - POSTGRES_PASSWORD=langfuse
      - POSTGRES_DB=langfuse
    volumes:
      - ./langfuse_data:/var/lib/postgresql/data

volumes:
  qdrant_data:
  langfuse_data: